# Netlify builds the site from this repository: run build.py, publish public/.
# preview-mobile.html is a local preview only and never ships (the drag-and-drop deploys
# left it out too).
[build]
  command = "python3 build.py && rm -f public/preview-mobile.html"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.12"

# /about is not a page; the About section lives on each language's home page.
# Do not merge or deploy this until Carla says go.
[[redirects]]
  from = "/about"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/about/"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/fr/about"
  to = "/fr/#about"
  status = 301

[[redirects]]
  from = "/fr/about/"
  to = "/fr/#about"
  status = 301

[[redirects]]
  from = "/pt-br/about"
  to = "/pt-br/#about"
  status = 301

[[redirects]]
  from = "/pt-br/about/"
  to = "/pt-br/#about"
  status = 301
